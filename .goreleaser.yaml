version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: gnat
    main: ./cmd/gnat
    binary: gnat
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.buildDate={{.Date}}

archives:
  - id: gnat
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  github:
    owner: galaxy-io
    name: gnat
  draft: false
  prerelease: auto

homebrew_casks:
  - name: gnat
    ids:
      - gnat
    binaries:
      - gnat
    repository:
      owner: galaxy-io
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: gx-null[bot]
      email: 286761379+gx-null[bot]@users.noreply.github.com
    directory: Casks
    homepage: "https://github.com/galaxy-io/gnat"
    description: "TUI Client for NATS"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gnat"]
          end
